services:
  db:
    image: postgres:16
    container_name: secure-saas-db
    environment:
      POSTGRES_DB: secure_saas
      POSTGRES_USER: secure_saas
      POSTGRES_PASSWORD: secure_saas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: secure-saas-redis
    ports:
      - "6379:6379"
    profiles: ["redis"]
  app:
    build: .
    container_name: secure-saas-app
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/secure_saas
      DB_USER: secure_saas
      DB_PASSWORD: secure_saas
      JWT_SIGNING_KEY: change-me-in-prod-change-me-in-prod-change-me-in-prod
      JWT_ISSUER: secure-saas-starter
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
volumes:
  postgres_data:

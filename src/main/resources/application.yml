server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: secure-saas-starter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_saas}
    username: ${DB_USER:secure_saas}
    password: ${DB_PASSWORD:secure_saas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:secure-saas-starter}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
      signing-key: ${JWT_SIGNING_KEY:change-me-in-prod-change-me-in-prod-change-me-in-prod}
    lockout:
      max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${LOCKOUT_DURATION:PT15M}
    oauth:
      google-enabled: ${OAUTH_GOOGLE_ENABLED:false}
  rate-limit:
    enabled: true
    redis-enabled: ${RATE_LIMIT_REDIS:false}
    auth:
      limit: 10
      window: PT1M
    api:
      limit: 120
      window: PT1M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE
    allowed-headers: "*"

logging:
  level:
    root: INFO
  pattern:
    level: "%5p"
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %p %c - %m%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
